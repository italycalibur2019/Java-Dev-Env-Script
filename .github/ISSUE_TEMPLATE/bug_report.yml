name: 问题反馈（Bug）
description: 安装或运行脚本时出错，某个组件装不上、起不来，或行为不符合预期
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先跑一遍自检，它能把排查需要的信息一次性收集齐：

        ```powershell
        powershell -NoProfile -ExecutionPolicy Bypass -File tools\Verify-Repo.ps1
        doctor.cmd
        ```

        > 贴日志前请把**真实用户名、安装路径、密码、内网地址**用 `<用户名>` `<安装目录>` 之类替换掉。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 发生了什么？从哪一步开始不对？控制台最后几行输出了什么？
      placeholder: 例如：执行 install.cmd 后卡在 [5/9] PostgreSQL 启动，20 分钟没有任何新输出
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      value: |
        1. 执行 `.\install.cmd`（或写成 `install.cmd -Components ...`）
        2. 
        3. 
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 使用的命令与参数
      placeholder: install.cmd -Components jdk,maven -Root D:\JavaDevEnv
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你本来期待发生什么？
    validations:
      required: false
  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      multiple: false
      options:
        - 下载（404 / 超时 / 大小校验失败 / 走代理）
        - 解压（压缩包结构或权限）
        - 环境变量与 PATH
        - 快捷方式
        - PostgreSQL 初始化或启动
        - Redis 初始化或启动
        - IDEA 便携模式 / Maven settings / npm 源
        - DSH 桌面端或命令行组件
        - status / doctor / uninstall / restore
        - 其他（请在「问题现象」里说明）
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor.cmd 自检输出
      description: 把整段输出粘进来（可在任意目录执行 `<安装根目录>\bin\doctor.cmd`）
      render: text
      placeholder: |
        [通过] JDK 21 ...
        [警告] ...
        自检完成：通过 8，警告 10，失败 0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 相关日志片段
      description: "`<安装根目录>\\logs\\setup-*.log` 里出错附近的几十行；数据库问题请再附 postgres.log / redis.log"
      render: text
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: Win+R 输入 winver 查看
      placeholder: Windows 11 Pro 24H2 (26100)
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell 版本
      description: 在 PowerShell 里执行 $PSVersionTable.PSVersion
      placeholder: "5.1.26100.9549"
    validations:
      required: true
  - type: dropdown
    id: elevation
    attributes:
      label: 是否以管理员身份运行
      options:
        - 否（普通用户终端）
        - 是（管理员 / 提权终端）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      options:
        - 直连公网
        - 公司内网，需要代理
        - 已配置 config\user.json 里的 download.proxy
        - 不确定
    validations:
      required: true
  - type: textarea
    id: user-config
    attributes:
      label: 你的 config\user.json（脱敏后）
      description: 有自定义配置就贴上来，**务必先删掉密码**
      render: json
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过已有 Issue，没有重复
          required: true
        - label: 我贴出的日志与配置里已经删除密码、密钥、真实用户名等敏感信息
          required: true
        - label: 问题能在最新版本上复现（不是很久以前 clone 的旧版本）
          required: false
