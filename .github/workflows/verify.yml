name: verify

# 守门 CI：这个项目的脚本对文件编码极其敏感，
#   .ps1 缺 BOM  -> Windows PowerShell 5.1 按 GBK 解析中文，直接语法报错
#   .cmd 带 BOM  -> cmd.exe 把 BOM 当命令的一部分
# 所以这里在 Windows 上分别用 Windows PowerShell 5.1 和 PowerShell 7 各跑一遍 tools\Verify-Repo.ps1。
# 5.1 那一遍才是关键——只有它会因为缺少 BOM 而失败。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: encoding & syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Verify-Repo.ps1

      - name: Verify with PowerShell 7
        shell: cmd
        run: pwsh -NoProfile -File tools\Verify-Repo.ps1
